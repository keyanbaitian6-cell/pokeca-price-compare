<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #17324d;
        background: #f4f7fb;
      }
      * { box-sizing: border-box; }
      body { margin: 0; padding: 24px 16px; }
      main {
        width: min(100%, 480px);
        margin: 0 auto;
        padding: 28px 22px;
        border-radius: 18px;
        background: #fff;
        box-shadow: 0 10px 28px rgba(29, 63, 96, 0.13);
      }
      h1 { margin: 0 0 10px; font-size: 1.45rem; }
      p { line-height: 1.65; }
      label { display: block; margin-top: 22px; font-weight: 700; }
      input {
        width: 100%;
        margin: 8px 0 14px;
        padding: 14px;
        border: 1px solid #9fb2c6;
        border-radius: 10px;
        font-size: 16px;
      }
      button, a.button {
        display: block;
        width: 100%;
        padding: 14px;
        border: 0;
        border-radius: 10px;
        font-size: 16px;
        font-weight: 700;
        text-align: center;
        text-decoration: none;
      }
      button { color: #fff; background: #1769aa; }
      button:disabled { opacity: 0.55; }
      a.button { margin-top: 12px; color: #fff; background: #26734d; }
      #message {
        display: none;
        margin-top: 18px;
        padding: 14px;
        border-radius: 10px;
        background: #eef4fa;
        line-height: 1.6;
      }
      #message.error { color: #8b1e1e; background: #fdecec; }
      .note { color: #52677a; font-size: 0.9rem; }
    </style>
  </head>
  <body>
    <main>
      <h1>ポケカ買取価格表を更新</h1>
      <p>合言葉を入力して更新を開始してください。完了まで通常は数分かかります。</p>

      <label for="passphrase">合言葉</label>
      <input id="passphrase" type="password" autocomplete="current-password" maxlength="128">
      <button id="updateButton" type="button" onclick="startUpdate()">価格表を更新する</button>

      <div id="message" role="status" aria-live="polite"></div>
      <a
        id="sheetLink"
        class="button"
        href="https://docs.google.com/spreadsheets/d/1N3mF4tIjuq8FC3JO5QnT2rPKPn-tu3I8lFLP8ZNysYI/edit"
        target="_blank"
        rel="noopener"
      >価格表を開く</a>

      <p class="note">連打防止のため、更新開始後5分間は再実行できません。</p>
    </main>

    <script>
      function showFailure(error) {
        const message = document.getElementById('message');
        message.className = 'error';
        message.textContent = '処理中にエラーが発生しました。時間を置いて再度お試しください。';
        message.style.display = 'block';
        document.getElementById('updateButton').disabled = false;
      }

      function startUpdate() {
        const button = document.getElementById('updateButton');
        const passphrase = document.getElementById('passphrase').value;
        const message = document.getElementById('message');
        button.disabled = true;
        message.className = '';
        message.textContent = '更新を受け付けています…';
        message.style.display = 'block';

        google.script.run
          .withSuccessHandler((result) => {
            button.disabled = false;
            message.className = result.ok ? '' : 'error';
            message.textContent = result.message;
            if (result.ok) {
              document.getElementById('passphrase').value = '';
            }
          })
          .withFailureHandler(showFailure)
          .startUpdate(passphrase);
      }

    </script>
  </body>
</html>
