[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "card-price-compare"
version = "0.1.0"
description = "Compare sealed Pokemon card buyback prices across Japanese stores."
requires-python = ">=3.10"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "pandas>=2.2,<4",
  "playwright>=1.50,<2",
  "requests>=2.32,<3",
]

[project.optional-dependencies]
google = ["gspread>=6.1,<7", "google-auth>=2.30,<3"]
dev = ["pytest>=8.3,<9"]

[project.scripts]
card-price-compare = "card_price_compare.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

