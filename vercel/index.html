<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <title>ポケカ買取価格表を更新</title>
    <link rel="stylesheet" href="/style.css">
  </head>
  <body>
    <main>
      <header class="hero">
        <p class="eyebrow">POKÉCA BUYBACK</p>
        <h1>価格表を更新</h1>
        <p class="lead">合言葉を入力して、最新の買取価格を取得します。</p>
      </header>

      <form id="updateForm">
        <label for="passphrase">合言葉</label>
        <input
          id="passphrase"
          name="passphrase"
          type="password"
          autocomplete="current-password"
          maxlength="128"
          required
        >
        <div class="actions" aria-label="更新方法">
          <button class="update-button primary-action" type="submit" name="mode" value="standard">
            <span class="action-title">通常更新</span>
            <span class="action-detail">コレクト・runto・買取ソムリエ</span>
          </button>
          <button class="update-button macho-action" type="submit" name="mode" value="with_macho">
            <span class="action-title">買取マッチョも更新</span>
            <span class="action-detail">15:00〜19:00限定 ・ 4サイト</span>
          </button>
        </div>
      </form>

      <div id="message" role="status" aria-live="polite"></div>
      <a
        class="button sheet-link"
        href="https://docs.google.com/spreadsheets/d/1N3mF4tIjuq8FC3JO5QnT2rPKPn-tu3I8lFLP8ZNysYI/edit"
        target="_blank"
        rel="noopener noreferrer"
      >価格表を見る <span aria-hidden="true">↗</span></a>

      <aside class="note">
        <strong>更新について</strong>
        <span>完了まで数分かかります。更新開始後5分間は再実行できません。</span>
      </aside>
    </main>
    <script src="/app.js" defer></script>
  </body>
</html>
