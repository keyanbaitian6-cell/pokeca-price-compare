<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <title>ポケカ買取価格表を更新</title>
    <link rel="stylesheet" href="/style.css">
  </head>
  <body>
    <main>
      <h1>ポケカ買取価格表を更新</h1>
      <p>合言葉を入力して更新を開始してください。完了まで通常は数分かかります。</p>

      <form id="updateForm">
        <label for="passphrase">合言葉</label>
        <input
          id="passphrase"
          name="passphrase"
          type="password"
          autocomplete="current-password"
          maxlength="128"
          required
        >
        <button class="update-button" type="submit" name="mode" value="standard">通常更新（3サイト）</button>
        <button class="update-button" type="submit" name="mode" value="with_macho">マッチョ込み更新（15〜19時）</button>
      </form>

      <div id="message" role="status" aria-live="polite"></div>
      <a
        class="button sheet-link"
        href="https://docs.google.com/spreadsheets/d/1N3mF4tIjuq8FC3JO5QnT2rPKPn-tu3I8lFLP8ZNysYI/edit"
        target="_blank"
        rel="noopener noreferrer"
      >価格表を開く</a>

      <p class="note">通常更新はコレクト・runto・買取ソムリエを更新します。買取マッチョを含む更新は、日本時間15:00〜19:00だけ実行できます。連打防止のため、更新開始後5分間は再実行できません。</p>
    </main>
    <script src="/app.js" defer></script>
  </body>
</html>
