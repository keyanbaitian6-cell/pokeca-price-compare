<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>サンプルEC Gamma（JSON-LD Schema.org デモ）</title>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "ItemList",
    "itemListElement": [
      {
        "@type": "ListItem",
        "position": 1,
        "item": {
          "@type": "Product",
          "name": "Sony WH-1000XM5 ワイヤレスヘッドホン",
          "itemCondition": "https://schema.org/NewCondition",
          "url": "https://shop-gamma.example/wh-1000xm5",
          "offers": {
            "@type": "Offer",
            "price": "42900",
            "priceCurrency": "JPY",
            "availability": "https://schema.org/InStock"
          }
        }
      },
      {
        "@type": "ListItem",
        "position": 2,
        "item": {
          "@type": "Product",
          "name": "Apple AirPods Pro 第2世代 USB-C",
          "itemCondition": "https://schema.org/NewCondition",
          "url": "https://shop-gamma.example/airpods-pro2",
          "offers": {
            "@type": "Offer",
            "price": "35800",
            "priceCurrency": "JPY",
            "availability": "https://schema.org/InStock"
          }
        }
      }
    ]
  }
  </script>
</head>
<body>
  <h1>サンプルEC Gamma（構造化データ対応ページ）</h1>
</body>
</html>
