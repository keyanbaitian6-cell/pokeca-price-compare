<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <title>マイ価格比較表を手動更新</title>
    <link rel="stylesheet" href="/style.css">
  </head>
  <body>
    <main>
      <header class="hero">
        <p class="eyebrow">PRICE MONITOR KIT</p>
        <h1>価格比較表を更新</h1>
        <p class="lead">合言葉を入力すると、GitHub Actions経由で最新の価格表をスプレッドシートへ反映します。</p>
      </header>

      <form id="updateForm">
        <label for="passphrase">合言葉</label>
        <input
          id="passphrase"
          name="passphrase"
          type="password"
          autocomplete="current-password"
          maxlength="128"
          required
        >
        <div class="actions">
          <button id="updateButton" class="update-button primary-action" type="submit">
            <span class="action-title">今すぐ価格表を更新する</span>
            <span class="action-detail">サーバー代0円・GitHub Actions自動連携</span>
          </button>
        </div>
      </form>

      <div id="message" role="status" aria-live="polite"></div>

      <!-- 任意：ご自身のGoogleスプレッドシートURLを設定すると「価格表を開く」ボタンが表示されます -->
      <a
        id="sheetLink"
        class="button sheet-link"
        href="https://docs.google.com/spreadsheets/d/YOUR_SPREADSHEET_ID/edit"
        target="_blank"
        rel="noopener noreferrer"
      >スプレッドシートを開く <span aria-hidden="true">↗</span></a>

      <aside class="note">
        <strong>安全運用について</strong>
        <span>通常は毎日決まった時刻に自動更新されます。対象サイトへの負荷を防ぐため、手動更新の実行後5分間は再実行できません。</span>
      </aside>
    </main>
    <script src="/app.js" defer></script>
  </body>
</html>
