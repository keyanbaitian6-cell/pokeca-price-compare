name = "price-monitor-mobile-updater"
main = "cloudflare_worker.js"
compatibility_date = "2026-01-01"

[assets]
directory = "."
binding = "ASSETS"

# 以下は Cloudflare ダッシュボード（または wrangler secret put）で登録してください
# - GITHUB_OWNER
# - GITHUB_REPO
# - GITHUB_TOKEN (Secret)
# - UPDATE_PASSWORD_HASH (Secret)
# - WORKFLOW_FILE (任意: 既定 update-prices.yml)
# - WORKFLOW_REF (任意: 既定 main)
