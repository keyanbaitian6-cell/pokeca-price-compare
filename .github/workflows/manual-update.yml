name: ポケカ価格表を手動更新

on:
  workflow_dispatch:
  schedule:
    # 毎日 13:42 JST (04:42 UTC) に自動実行（毎時00分の混雑回避のためずらす）
    - cron: "42 4 * * *"

permissions:
  contents: write

# A second button press waits instead of cancelling an update in progress.
concurrency:
  group: pokeca-price-manual-update
  cancel-in-progress: false

jobs:
  update-price-sheet:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Tokyo

    steps:
      - name: ソースコードを取得
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Pythonを準備
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-google.txt

      - name: Pythonライブラリを導入
        run: python -m pip install -r requirements-google.txt

      - name: Chromiumを導入
        run: python -m playwright install --with-deps chromium

      - name: 価格表を取得してGoogleシートと公開相場JSONを更新
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          OUTPUT_SPREADSHEET_ID: "1N3mF4tIjuq8FC3JO5QnT2rPKPn-tu3I8lFLP8ZNysYI"
          PYTHONPATH: src
        shell: bash
        run: |
          credentials_path="$RUNNER_TEMP/google-credentials.json"
          printf '%s' "$GOOGLE_CREDENTIALS_JSON" > "$credentials_path"
          python -m card_price_compare \
            --output-dir "$RUNNER_TEMP/card-price-output" \
            --google-spreadsheet-id "$OUTPUT_SPREADSHEET_ID" \
            --google-credentials "$credentials_path" \
            --web-market-json "site/market/data/market_index.json"

      - name: 公開相場インデックスJSONの変更を反映
        shell: bash
        run: |
          if git diff --quiet -- site/market/data/market_index.json; then
            echo "market_index.json に変更はありません。"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/market/data/market_index.json
          git commit -m "chore(market): 日次匿名相場インデックスを更新 ($(date +%Y-%m-%d))"
          git pull --rebase origin main
          git push origin HEAD:main
