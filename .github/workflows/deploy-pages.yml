name: トレカ損益ラボをGitHub Pagesへ公開

on:
  push:
    branches: ["main"]
    paths:
      - "site/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_run:
    workflows: ["ポケカ価格表を手動更新"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-deploy"
  cancel-in-progress: false

jobs:
  test-and-build:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: ソースコードを取得
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Node.jsを準備
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 計算エンジンの単体テストを実行
        working-directory: site
        run: npm test

      - name: Pages成果物を準備（テストファイルを除外）
        run: |
          mkdir -p _site
          cp -R site/* _site/
          rm -rf _site/test _site/package.json _site/vercel.json

      - name: GitHub Pages設定
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Pagesアーティファクトをアップロード
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: test-and-build
    steps:
      - name: GitHub Pagesへデプロイ
        id: deployment
        uses: actions/deploy-pages@v4
